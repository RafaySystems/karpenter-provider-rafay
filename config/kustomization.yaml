apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No global namespace: — rafay-system is not declared here (platform provides it). karpenter is for leader-election only.
# Namespaced resources set metadata.namespace in deploy/*.yaml.
#
# Apply: kubectl apply -k config   (not kubectl apply -f config/kustomization.yaml)

resources:
  - crd/karpenter.sh_nodepools.yaml
  - crd/karpenter.sh_nodeclaims.yaml
  - crd/karpenter.rafay.io_rafaynodeclasses.yaml
  - deploy/namespace-karpenter-leader.yaml
  - deploy/serviceaccount.yaml
  - deploy/rbac.yaml
  - deploy/deployment.yaml

# Override image after build, e.g.:
# images:
#   - name: karpenter-provider-rafay
#     newName: registry.dev.rafay-edge.net/myuser/karpenter-provider-rafay
#     newTag: main-20260403-1200
