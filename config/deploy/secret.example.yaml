# Optional Secret for extra env keys merged into the controller (envFrom), e.g. RAFAY_CLUSTER_ID overrides.
# Apply: kubectl apply -f secret.yaml -n rafay-system
#
# TLS for edge-broker comes from Secret edge-client-creds (mounted in Deployment), not from this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: karpenter-provider-rafay
  namespace: rafay-system
type: Opaque
stringData:
  RAFAY_CLUSTER_ID: ""
  RAFAY_PROJECT_ID: ""
