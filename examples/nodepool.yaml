# Example RafayNodeClass + NodePool for karpenter-provider-rafay (edge-broker only).
# Edit clusterID / projectID to match your Rafay cluster, then:
#   kubectl apply -f examples/nodepool.yaml
#
# Requires: CRDs applied (config/crd/) and controller running with broker TLS + EDGE_ID/STREAM_ID.
---
apiVersion: karpenter.rafay.io/v1alpha1
kind: RafayNodeClass
metadata:
  name: default
spec:
  clusterID: "replace-with-rafay-cluster-id"
  projectID: "replace-with-rafay-project-id"
  # Names must match what Rafay accepts in AddNodes; tune cpu/memory to real shapes if needed.
  # If omitted, the provider uses the same set as built-in defaults.
  instanceTypes:
    - name: standard-2-4
      cpu: "2"
      memory: "4Gi"
      zone: default
    - name: standard-4-8
      cpu: "4"
      memory: "8Gi"
      zone: default
    - name: standard-8-16
      cpu: "8"
      memory: "16Gi"
      zone: default
    - name: standard-16-32
      cpu: "16"
      memory: "32Gi"
      zone: default
    - name: standard-32-64
      cpu: "32"
      memory: "64Gi"
      zone: default
    - name: standard-48-96
      cpu: "48"
      memory: "96Gi"
      zone: default
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  weight: 100
  template:
    metadata:
      labels:
        nodepool: default
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64", "arm64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      nodeClassRef:
        group: karpenter.rafay.io
        kind: RafayNodeClass
        name: default
  limits:
    cpu: "1000"
    memory: 1000Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
