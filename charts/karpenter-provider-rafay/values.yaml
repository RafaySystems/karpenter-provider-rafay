# Default values for karpenter-provider-rafay.
# Rafay control plane: use this chart from a Helm catalog when creating a custom add-on.

replicaCount: 1

image:
  repository: karpenter-provider-rafay
  tag: latest
  pullPolicy: IfNotPresent

# Deployment and ServiceAccount live here (must exist; same as edge-client).
namespace:
  workload: rafay-system

# Namespace used only for leader-election Lease objects (see deployment comments).
leaderElection:
  namespace: karpenter

edgeBroker:
  certFolder: /opt/rcloud/certs
  serverPort: "443"
  grpcInsecure: false
  grpcPort: ""
  grpcHost: ""

optionalEnv:
  edgeId: ""
  streamId: ""
  rafayClusterId: ""
  rafayProjectId: ""

secrets:
  # TLS material volume (client.crt, client.key, ca.crt) — same pattern as edge-client.
  edgeClientCreds: edge-client-creds
  # Optional Secret for extra env via envFrom (set to "" to omit).
  envFrom: karpenter-provider-rafay

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Extra container env (list of {name, value}); merged after defaults.
extraEnv: []

nameOverride: ""
# Keep API object names aligned with config/deploy/*.yaml (plain kubectl apply).
fullnameOverride: karpenter-provider-rafay

# Optional RafayNodeClass + NodePool CRs (Path 1: enable + tune via Rafay cluster overrides on values).
# When enabled, applies after CRDs exist (same chart / same release as the controller).
pools:
  enabled: false
  # Set only if your RafayNodeClass spec still requires them; many setups use controller env instead.
  clusterID: ""
  projectID: ""
  nodeClasses:
    - name: oci-inst
      instanceTypes:
        - name: oci-inst
          cpu: "8"
          memory: "16Gi"
          architectures: ["amd64"]
          operatingSystems: ["linux"]
    - name: oci-inst-arm
      instanceTypes:
        - name: oci-inst-arm
          cpu: "8"
          memory: "16Gi"
          architectures: ["arm64"]
          operatingSystems: ["linux"]
  nodePools:
    - name: worker-pool-amd
      weight: 100
      nodeClassName: oci-inst
      nodepoolLabel: worker-pool-amd
      archValues: ["amd64"]
      capacityTypes: ["on-demand"]
      limits:
        cpu: "1000"
        memory: "1000Gi"
      consolidateAfter: 5m
    - name: worker-pool-arm
      weight: 100
      nodeClassName: oci-inst-arm
      nodepoolLabel: worker-pool-arm
      archValues: ["arm64"]
      capacityTypes: ["on-demand"]
      limits:
        cpu: "1000"
        memory: "1000Gi"
      consolidateAfter: 5m
